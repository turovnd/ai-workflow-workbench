name: Verify workbench
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: workflow
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/workflow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run typecheck
      - run: npm test && npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: docker compose --profile local up --build --wait -d
        env:
          POSTGRES_PASSWORD: local-compose-ci-only
          GENERATION_MODE: deterministic
          ALLOW_LIVE_PROVIDER: 'false'
      - run: npm run test:e2e
      - run: docker compose --profile local down
        if: always()
        env:
          POSTGRES_PASSWORD: local-compose-ci-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-traces
          path: test-results
